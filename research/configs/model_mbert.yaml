# Experiment C — mBERT (bert-base-multilingual-cased) fine-tuning, in-domain.
#
# mBERT is the genuine novel extension over the paper being replicated
# (DECISION_REGISTER.md R4): Haroon 2026 tested XLM-R only, so a second
# architecture is what makes it possible to say whether the cross-dataset collapse
# is model-general or XLM-R-specific. That question is why C exists; it is not a
# second-choice model.
#
# Hyperparameters are held DELIBERATELY IDENTICAL to model_xlmr.yaml wherever the
# architecture allows. If C and D are trained under different budgets, any
# difference between them is confounded by the hyperparameters and the
# "model-general or not?" question cannot be answered. The cased checkpoint is used
# because Urdu is unicase and lowercasing would only damage code-switched Latin
# spans.

version: 1

model:
  name: bert-base-multilingual-cased
  hf_model_id: bert-base-multilingual-cased
  experiment_id: C
  num_labels: 2

tokenizer:
  # mBERT's ceiling is also 512 position embeddings — the same constraint as XLM-R,
  # so DECISION_REGISTER.md M4-1 applies identically here.
  max_length: 512
  truncation: true
  padding: max_length

training:
  seeds: [42, 123, 2026]

  # Matched to XLM-R. 2e-5 is also the standard BERT fine-tuning rate, so holding
  # them equal costs nothing in appropriateness while keeping C and D comparable.
  learning_rate: 2.0e-5

  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1

  num_train_epochs: 3

  optimizer: adamw_torch
  weight_decay: 0.01
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  warmup_ratio: 0.1
  lr_scheduler_type: linear

  fp16: true

  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: macro_f1
  greater_is_better: true
  save_total_limit: 1

  logging_steps: 50
  dataloader_num_workers: 2

evaluation:
  splits_evaluated: [val, test]
  primary_metric: macro_f1

checkpoint_push:
  enabled: true
  staging_repo_suffix: urdu-misinfo-mbert-staging
  private: true
